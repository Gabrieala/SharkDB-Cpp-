<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SharkDB - World of Sharks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>World of Sharks</h1>
            <p class="subtitle">Hope you'll have a nice time here and learn something new!</p>
        </div>
    </header>

    <main class="container">
        <nav class="tabs" role="tablist">
            <button class="tab-btn active" data-tab="view">View All Sharks</button>
            <button class="tab-btn" data-tab="search">Search by Name</button>
            <button class="tab-btn" data-tab="add">Add a New Shark</button>
        </nav>

        <section id="tab-view" class="tab-panel active">
            <div class="panel-header">
                <h2>All Sharks (<span id="shark-count">0</span>)</h2>
                <div class="filter-bar">
                    <label for="status-filter">Status:</label>
                    <select id="status-filter">
                        <option value="all">All</option>
                        <option value="least concern">Least Concern</option>
                        <option value="near threatened">Near Threatened</option>
                        <option value="vulnerable">Vulnerable</option>
                        <option value="endangered">Endangered</option>
                        <option value="critically endangered">Critically Endangered</option>
                    </select>
                </div>
            </div>
            <div id="shark-list" class="shark-grid"></div>
        </section>

        <section id="tab-search" class="tab-panel">
            <h2>Search for a Shark by Name</h2>
            <form id="search-form" class="search-bar">
                <input type="text" id="search-input" placeholder="Enter shark name (e.g. Bull Shark)" autocomplete="off">
                <button type="submit" class="btn-primary">Search</button>
            </form>
            <div id="search-result"></div>
        </section>

        <section id="tab-add" class="tab-panel">
            <h2>Add a New Shark</h2>
            <form id="add-form" class="add-form">
                <div class="form-group">
                    <label for="shark-name">Shark's Name</label>
                    <input type="text" id="shark-name" required placeholder="e.g. Hammerhead Shark">
                </div>
                <div class="form-group">
                    <label for="shark-description">Description</label>
                    <textarea id="shark-description" rows="2" required placeholder="Enter its description"></textarea>
                </div>
                <div class="form-group">
                    <label for="shark-habitat">Habitat</label>
                    <input type="text" id="shark-habitat" required placeholder="Enter its habitat">
                </div>
                <div class="form-group">
                    <label for="shark-diet">Diet</label>
                    <input type="text" id="shark-diet" required placeholder="Enter its diet">
                </div>
                <div class="form-group">
                    <label for="shark-status">Conservation Status</label>
                    <select id="shark-status" required>
                        <option value="Least Concern">Least Concern</option>
                        <option value="Near Threatened">Near Threatened</option>
                        <option value="Vulnerable">Vulnerable</option>
                        <option value="Endangered">Endangered</option>
                        <option value="Critically Endangered">Critically Endangered</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="shark-fact">Fun Fact</label>
                    <textarea id="shark-fact" rows="2" required placeholder="Enter a fun fact"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">Add Shark</button>
                    <button type="button" id="reset-btn" class="btn-secondary">Reset Defaults</button>
                </div>
                <p id="add-message" class="status-msg"></p>
            </form>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Thank you for showing interest in learning about sharks — visit again!</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
